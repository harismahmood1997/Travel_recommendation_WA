<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - TravelBloom</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

  <!-- Navbar (No Search Bar) -->
  <nav class="navbar">
    <div class="nav-brand">
      <img src="images/travel.jpg" alt="TravelBloom Logo" class="logo-img">
      <span class="brand-title">TravelBloom</span>
    </div>

    <div class="nav-links">
      <a href="./travel_Recommendation.html">Home</a>
      <a href="./about_us.html">About Us</a>
      <a href="./contact_us.html">Contact Us</a>
    </div>
  </nav>

  <!-- Contact Us Hero Section -->
  <section class="contact-hero-section">
    <!-- Social Icons Sidebar -->
    <div class="social-icons">
      <a href="#" aria-label="Twitter"><i class="fab fa-twitter"></i></a>
      <a href="#" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
    </div>

    <div class="contact-container">
      <!-- Left Heading Box -->
      <div class="contact-left">
        <h1 class="contact-title">CONTACT US</h1>
        <p class="contact-subtitle">Get in touch</p>
      </div>

      <!-- Right Form Box -->
      <div class="contact-form-wrapper">
        <form class="contact-form" onsubmit="event.preventDefault(); alert('Thank you! Your message has been submitted.');">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="4" placeholder="Enter your message" required></textarea>
          </div>

          <button type="submit" class="btn-submit">Submit</button>
        </form>
      </div>
    </div>
  </section>

</body>
</html>
